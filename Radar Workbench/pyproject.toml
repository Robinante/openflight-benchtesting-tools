[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "openflight-bench"
version = "0.1.0"
description = "Interactive IWR6843 bench capture and profile-control tools for OpenFlight"
requires-python = ">=3.10"
dependencies = ["pyserial>=3.5"]

[project.scripts]
openflight-bench = "openflight_bench.cli:main"

[tool.setuptools.packages.find]
include = ["openflight_bench*"]
